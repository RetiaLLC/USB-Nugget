name: USB-Nugget build

on:
  push:
    branches: [ main, bp-dev ]
    paths: [ "src/**" ]
  pull_request:
    branches: [ main, bp-dev ]
    paths: [ "src/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
    - with:
        repository: RetiaLLC/EspTinyUSB
        token: ${{ ESP_TINY_USB_PRIVATE_SSH_KEY }}
      run: |
        cd src
        make build
